<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#grid)"/>

  <!-- 차트 라인 -->
  <polyline points="80,340 150,300 220,320 290,240 360,260 432,160"
    fill="none" stroke="#00E88F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 펄스 도트 -->
  <circle cx="432" cy="160" r="14" fill="#00E88F"/>
  <circle cx="432" cy="160" r="28" fill="none" stroke="#00E88F" stroke-width="3" opacity="0.4"/>

  <!-- 텍스트 -->
  <text x="256" y="420" text-anchor="middle" font-family="monospace" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="6">PULSE</text>
</svg>
